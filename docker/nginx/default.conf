# ============================================================
#  T29 · 前端静态站点（nginx:alpine）
#  方案取舍：选用「独立 nginx 服务」而非「FastAPI StaticFiles 挂载」——
#    前端是原生 ES Modules 无构建产物，nginx 直接服务静态文件即可；
#    前后端镜像/进程互不牵制，API 重启不影响页面访问（反之亦然）。
#  说明：前端 API_BASE 默认 http://127.0.0.1:8000（CORS 已放行 8080 来源），
#        也可用 window.__API_BASE__ 覆盖；故此处不做 /api 反代。
# ============================================================
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 静态资源缓存（内容哈希不变，可长缓存）
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA 回退：hash 路由（#/...）本就不走服务端，这里兜底任意路径 → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全响应头（最小集）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
