# ============================================================
#  生产 nginx · 前端静态 + /api 反代（只对外暴露 8081）
#  关键点：SSE 流式必须 proxy_buffering off + 长 read_timeout
#     （与后端 RATE_LIMIT_SSE_MAX_SECONDS=300 对齐）
# ============================================================
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # index.html 必须禁缓存：它承载 window.__API_BASE__ 注入，
    # 一旦被浏览器缓存住旧版，前端会把 API 请求发到错误地址（曾导致线上全部接口加载失败）
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # 静态资源长缓存（Vite 产物文件名带内容哈希，可放心长缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 健康检查（后端实际路径是 /health，不在 /api 前缀下，需单独映射）
    location = /health {
        proxy_pass http://api:8000/health;
        access_log off;
    }

    # API 反代到后端容器（路径 /api/xxx 原样透传）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE 流式三件套
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 长连接超时（与后端 SSE 300s 上限对齐）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA 回退（hash 路由 #/... 本就不走服务端，这里兜底任意路径）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全响应头（最小集）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
